global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'iot-platform'
    static_configs:
      - targets: ['iot-platform:9090']
        labels:
          service: 'mqtt-broker'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
