version: '3.8'

services:
  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped

  # EMQX MQTT Broker (alternative to Mosquitto)
  emqx:
    image: emqx/emqx:5.3.0
    container_name: iot-emqx
    ports:
      - "1884:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1.emqx.local
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.local]
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - iot-network
    restart: unless-stopped
    profiles:
      - emqx

  # Redis for hot storage
  redis:
    image: redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - iot-network
    restart: unless-stopped

  # MongoDB for cold storage
  mongodb:
    image: mongo:7
    container_name: iot-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=iot-platform
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - iot-network
    restart: unless-stopped

  # IoT Platform Application
  iot-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-platform-app
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_BROKER_TYPE=mosquitto
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_HOT_URL=redis://redis:6379
      - STORAGE_COLD_URL=mongodb://admin:admin123@mongodb:27017/iot-platform?authSource=admin
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
    depends_on:
      - mosquitto
      - redis
      - mongodb
    networks:
      - iot-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: iot-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - iot-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - iot-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  iot-network:
    driver: bridge

volumes:
  emqx-data:
  emqx-log:
  redis-data:
  mongodb-data:
  mongodb-config:
  prometheus-data:
  grafana-data:
